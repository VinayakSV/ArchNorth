    <!-- GitHub Pages SPA: decodes the ?/ redirect from 404.html back into a real URL before React Router loads -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>

    <!-- Google Analytics 4 with Consent Mode V2 — cookie-less by default, GDPR/UK-GDPR compliant -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      // Deny all storage by default — no cookies are set until/unless consent is granted.
      // This satisfies GDPR/UK-GDPR without a cookie banner for a non-commercial site.
      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        wait_for_update: 500
      });
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LE4FL3P2EB"></script>

      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-LE4FL3P2EB', { anonymize_ip: true });
    </script>
